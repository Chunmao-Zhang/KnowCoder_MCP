[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowcoder-mcp"
version = "0.1.0"
description = "KnowCoder MCP server for building verified, source-grounded knowledge workspaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.6",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "lxml>=5.0",
  "mcp>=1.27,<2",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "playwright>=1.45",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
knowcoder-mcp = "knowcoder_workspace_builder.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["knowcoder_workspace_builder*"]
exclude = ["knowcoder_workspace_builder.subagents*"]
namespaces = false

[tool.setuptools.package-data]
knowcoder_workspace_builder = [
  "AGENT.md",
  "harness.json",
  "harness/harness_prompt/*.md",
  "skills/*/SKILL.md",
  "static/*",
  "subagents/*/AGENT.md",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".knowcoder_workspace", "knowcoder_workspace_builder/harness"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
