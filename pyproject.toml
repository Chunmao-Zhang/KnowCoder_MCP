[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowcoder-mcp"
version = "0.1.0"
description = "KnowCoder MCP server for building verified, source-grounded knowledge workspaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.6",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "lxml>=5.0",
  "mcp>=1.27,<2",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.scripts]
knowcoder-mcp = "knowcoder_workspace_builder.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["knowcoder_workspace_builder*"]
exclude = ["knowcoder_workspace_builder.subagents*"]
namespaces = false

[tool.setuptools.package-data]
knowcoder_workspace_builder = [
  "AGENT.md",
  "harness.json",
  "harness/harness_prompt/*.md",
  "skills/*/SKILL.md",
  "static/*",
  "subagents/*/AGENT.md",
]
